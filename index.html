<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Star Map</title>
<style>
  :root { --bg:#05070b; --fg:#d6dee6; --muted:#7c8896; --panel:#0c1117; --edge:#56636f; --accent:#3ec7d9; --gm:#e5484d; --gold:#f5c542; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font:14px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; overflow:hidden; }
  #stars { position:fixed; inset:0; }
  #crt { position:fixed; inset:0; pointer-events:none; z-index:2;
    background:repeating-linear-gradient(to bottom, rgba(255,255,255,.022) 0 1px, transparent 1px 3px),
      radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.6)); }
  #flash { position:fixed; inset:0; pointer-events:none; opacity:0; z-index:3;
    background:radial-gradient(circle, rgba(190,225,255,.55), rgba(120,170,255,.12) 45%, transparent 75%); }
  #flash.go { animation:flash .7s ease-out; }
  @keyframes flash { 0% { opacity:1; } 100% { opacity:0; } }
  #viewport { position:fixed; inset:0; cursor:grab; touch-action:none; user-select:none; }
  #viewport.dragging { cursor:grabbing; }
  #world { position:absolute; left:0; top:0; transform-origin:0 0; }

  .group { position:absolute; border:2px solid var(--gc); border-radius:18px;
    background:color-mix(in srgb, var(--gc) 6%, transparent); }
  .group.gm-only { border-style:dashed; }
  .group-label { position:absolute; bottom:100%; left:10px; margin-bottom:8px; font-size:30px; font-weight:700;
    color:var(--gc); white-space:nowrap; letter-spacing:.06em; text-transform:uppercase; }

  svg#edges { position:absolute; left:0; top:0; overflow:visible; pointer-events:none; }
  svg#edges line { stroke:var(--edge); stroke-width:3; transition:opacity .2s; }
  svg#edges line.long { stroke:#c9d4de; stroke-width:5; }
  svg#edges line.suggested { stroke:#a274f0; stroke-width:4; stroke-dasharray:18 12; }
  svg#edges line.rel { stroke:#8a96a3; stroke-width:2; stroke-dasharray:3 7; }
  svg#edges line.fogline { stroke:#3a4552; stroke-dasharray:6 10; }
  svg#edges line.hl { stroke:#fff; stroke-width:6; }
  svg#edges line.over { opacity:.12; }
  svg#edges line.route { stroke:var(--gold); stroke-width:9; stroke-dasharray:none; opacity:1;
    filter:drop-shadow(0 0 10px var(--gold)); }
  svg#edges polyline.trail { fill:none; stroke:var(--gold); stroke-width:4; stroke-dasharray:2 14; stroke-linecap:round; opacity:.7; }
  .elabel { position:absolute; transform:translate(-50%,-50%); padding:2px 8px; border-radius:6px; font-size:14px;
    background:#05070b; border:1px solid var(--edge); color:#c9d4de; white-space:nowrap; pointer-events:none; transition:opacity .2s; }
  .elabel.suggested { border-color:#a274f0; color:#c9b2f7; }
  .elabel.rel { border-style:dotted; color:var(--muted); font-size:12px; }

  .node { position:absolute; padding:10px 14px; border:2px solid var(--nc); border-radius:10px; background:#0b1016;
    box-shadow:0 0 22px color-mix(in srgb, var(--nc) 30%, transparent); cursor:pointer; font-size:15px;
    transition:opacity .2s, box-shadow .2s, border-color .2s; }
  .node:hover { box-shadow:0 0 34px color-mix(in srgb, var(--nc) 70%, transparent); }
  .node.sel { outline:4px solid #fff; outline-offset:3px; }
  .node.gm-only, .node.fogged { border-style:dashed; }
  .node.fog { border:2px dashed #2a3440; background:rgba(11,16,22,.6); box-shadow:none; color:#3a4552;
    display:grid; place-items:center; letter-spacing:.3em; font-size:13px; }
  .node h1 { font-size:34px; margin:0 0 8px; }
  .link { color:#8fd3ff; text-decoration:none; }
  a.link { border-bottom:1px dotted #8fd3ff; }
  .dim, .unreach { opacity:.15; }
  .gm { margin-top:8px; padding:5px 8px; border-left:3px solid var(--gm); background:rgba(229,72,77,.1); color:#f4b4b6; }
  .gm::before, .gmtag { display:block; font-size:11px; font-weight:700; letter-spacing:.12em; color:var(--gm); }
  .gm::before { content:"GM"; }
  .gmtag { margin-bottom:4px; }

  .badges { position:absolute; top:7px; right:7px; display:flex; gap:4px; }
  .badge { display:inline-grid; place-items:center; min-width:26px; height:26px; padding:0 6px; border-radius:13px;
    background:var(--bc); color:#05070b; font-weight:800; font-size:14px; line-height:1; }
  .node .badges .badge { box-shadow:0 0 10px color-mix(in srgb, var(--bc) 60%, transparent); }
  .jumps { position:absolute; bottom:-14px; right:10px; padding:2px 8px; border-radius:8px; background:var(--gold);
    color:#05070b; font-weight:800; font-size:13px; display:none; }
  body.reach-on .node:not(.unreach) .jumps { display:block; }

  .visit { position:absolute; top:-16px; left:-16px; width:32px; height:32px; border-radius:50%; background:var(--gold);
    color:#05070b; display:grid; place-items:center; font-weight:800; font-size:15px; box-shadow:0 0 12px var(--gold); }
  .crewtag { position:absolute; bottom:calc(100% + 10px); left:0; padding:4px 10px; border-radius:8px; white-space:nowrap;
    background:var(--gold); color:#05070b; font-weight:800; font-size:16px; box-shadow:0 0 18px var(--gold); }
  .node.crew { animation:crew 2.2s ease-in-out infinite; }
  @keyframes crew { 0%,100% { box-shadow:0 0 18px var(--gold); } 50% { box-shadow:0 0 52px var(--gold), 0 0 0 6px rgba(245,197,66,.25); } }
  #ship { position:absolute; left:0; top:0; width:110px; height:110px; margin:-55px 0 0 -55px; display:none; pointer-events:none; z-index:10;
    filter:drop-shadow(0 0 16px var(--gold)); }

  body.factions-on .node.has-faction { border-color:var(--fc); box-shadow:0 0 30px var(--fc); }
  body.factions-on .node:not(.has-faction):not(.fog), body.factions-on .node.faction-off { opacity:.2; }

  #ui { position:fixed; top:14px; left:14px; width:min(400px, calc(100vw - 28px)); z-index:5; display:flex; flex-direction:column; gap:6px; }
  #ui .bar { display:flex; gap:6px; }
  input, select { padding:9px 12px; border-radius:8px; border:1px solid #2a3440; background:var(--panel); color:var(--fg); font:inherit; min-width:0; }
  #search { flex:1; }
  button { padding:8px 11px; border-radius:8px; border:1px solid #2a3440; background:var(--panel); color:var(--fg); font:inherit; cursor:pointer; white-space:nowrap; }
  button:hover { border-color:var(--accent); }
  button.on { border-color:var(--gold); color:var(--gold); }
  body.gm-mode #gmbtn { border-color:var(--gm); color:#f4b4b6; }
  #gmform { display:none; gap:6px; align-items:center; }
  #gmform.open { display:flex; }
  #gmform input { flex:1; }
  #gmmsg { color:var(--gm); font-size:12px; }
  #gmmsg:empty { display:none; }
  .box { background:var(--panel); border:1px solid #2a3440; border-radius:8px; padding:10px 12px; max-height:45vh; overflow:auto; display:none; }
  .box.open { display:block; }
  .box h4 { margin:0 0 6px; font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; }
  .box .row { padding:5px 0; border-bottom:1px solid #1b242e; cursor:pointer; }
  .box .row:hover { color:var(--accent); }
  .box .row small { display:block; color:var(--muted); }
  .swatch { display:inline-block; width:12px; height:12px; border-radius:3px; margin-right:8px; vertical-align:-1px; background:var(--fc); }
  .row.faction-sel { color:var(--gold); }
  #results { background:var(--panel); border:1px solid #2a3440; border-radius:8px; overflow:hidden; display:none; }
  #results div { padding:7px 12px; cursor:pointer; }
  #results div:hover, #results div.active { background:#16202a; }
  #results small { color:var(--muted); }
  #banner { display:none; position:fixed; top:14px; left:50%; transform:translateX(-50%); padding:6px 14px; border-radius:8px;
    background:rgba(229,72,77,.15); border:1px solid var(--gm); color:#f4b4b6; font-weight:700; letter-spacing:.15em; z-index:4; }
  body.gm-mode #banner { display:block; }

  #routebox { position:fixed; left:14px; bottom:36px; width:min(400px, calc(100vw - 28px)); z-index:5; display:none;
    background:var(--panel); border:1px solid var(--gold); border-radius:10px; padding:12px 14px; max-height:50vh; overflow:auto; }
  #routebox.open { display:block; }
  #routebox h4 { margin:0 0 6px; color:var(--gold); font-size:13px; text-transform:uppercase; letter-spacing:.08em; }
  #routebox .sum { margin:6px 0 8px; }
  #routebox .hop { padding:3px 0; color:var(--muted); }
  #routebox .hop b { color:var(--fg); font-weight:600; }
  #routebox .acts { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
  #routebox .roll { margin-top:8px; padding:8px; border-radius:6px; background:#11181f; }

  #panel { position:fixed; top:0; right:0; height:100%; width:min(380px, 100vw); background:var(--panel); border-left:1px solid #2a3440;
    padding:22px 22px 40px; overflow:auto; transform:translateX(100%); transition:transform .25s; z-index:6; }
  #panel.open { transform:none; }
  #panel .close { position:absolute; top:12px; right:12px; }
  #panel .region { color:var(--muted); text-transform:uppercase; font-size:12px; letter-spacing:.08em; margin-bottom:10px; padding-right:40px; }
  #panel .body { font-size:15px; }
  #panel h1 { font-size:24px; margin:0 0 6px; }
  #panel h3 { margin:22px 0 8px; font-size:13px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; }
  #panel .conn { padding:6px 0; border-bottom:1px solid #1b242e; cursor:pointer; }
  #panel .conn:hover { color:var(--accent); }
  #panel .conn span { color:var(--muted); }
  #panel .conn:not([data-id]) { cursor:default; color:var(--muted); }
  #panel .conn.gmrel { border-left:3px solid var(--gm); padding-left:8px; }
  #panel .conn .badge { color:#05070b; margin-right:8px; }
  #panel .conn.port { color:var(--fg); cursor:default; }
  #panel .conn.port small { display:block; color:var(--muted); margin-top:2px; }
  #panel .chips { display:flex; flex-wrap:wrap; gap:6px; }
  #panel .chip { padding:3px 8px; border:1px solid #2a3440; border-radius:6px; cursor:pointer; }
  #panel .chip:hover { border-color:var(--accent); color:var(--accent); }
  #panel .chip.gmrel { border-color:var(--gm); }
  #panel .acts { display:flex; gap:6px; flex-wrap:wrap; margin-top:16px; }
  #hint { position:fixed; bottom:12px; left:14px; color:var(--muted); font-size:12px; z-index:5; }
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div id="viewport"><div id="world"></div></div>
<div id="crt"></div>
<div id="flash"></div>
<div id="banner">GM MODE</div>
<div id="ui">
  <div class="bar">
    <input id="search" placeholder="Search systems…" autocomplete="off">
    <button id="fit" title="Fit map">⤢</button>
    <button id="zin" title="Zoom in">+</button>
    <button id="zout" title="Zoom out">−</button>
    <button id="gmbtn" title="GM mode">🔒</button>
  </div>
  <div class="bar">
    <select id="drive" title="Jump drive rating"></select>
    <button id="reachbtn" title="Show where this drive can reach">Reach</button>
    <button id="facbtn" title="Faction overlay">Factions</button>
    <button id="logbtn" title="Travel log">Log</button>
    <button id="crewbtn" title="Go to the crew">◎ Crew</button>
  </div>
  <form id="gmform"><input id="gmpw" type="password" placeholder="GM password" autocomplete="off"><button type="submit">Unlock</button></form>
  <div id="gmmsg"></div>
  <div id="results"></div>
  <div id="logbox" class="box"></div>
  <div id="facbox" class="box"></div>
</div>
<div id="routebox"></div>
<aside id="panel"><button class="close" id="close">✕</button><div id="pcontent"></div></aside>
<div id="hint">Drag to pan · scroll / pinch to zoom · click a location for details</div>

  return path ? `<a class="link" href="obsidian://open?vault=${encodeURIComponent(vault.name)}&file=${encodeURIComponent(path)}" title="Open in Obsidian">${label}</a>`
    : `<span class="link">${label}</span>`;
}
function md(text) {
  return text.split("\n").map(line => {
    const h = line.match(/^#{1,6}\s+(.*)$/);
    const s = esc(h ? h[1] : line)
      .replace(/\[\[([^\]|]+)\|([^\]]+)\]\]/g, (_, t, a) => wikilink(t, a))
      .replace(/\[\[([^\]]+)\]\]/g, (_, t) => wikilink(t))
      .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
      .replace(/(^|[^*])\*([^*]+)\*/g, "$1<i>$2</i>");
    return h ? `<h1>${s}</h1>` : s;
  }).join("<br>").replace(/<\/h1><br>/g, "</h1>").replace(/(<br>)+$/, "");
}
const plain = s => s.replace(/^#+\s*/, "").replace(/\[\[([^\]|]+)\|([^\]]+)\]\]/g, "$2")
  .replace(/\[\[([^\]]+)\]\]/g, "$1").replace(/\*+/g, "").trim();
const titleOf = n => n.fog ? "Uncharted" : plain((n.text || n.file || n.id).split("\n")[0]);
const shortTitle = n => titleOf(n).replace(/\s*\[[A-Z]\]/g, "").replace(/^\d+[a-z]?\.\s*/, "").replace(/\s*\(.*?\)\s*$/, "");
const META = /^(related|faction):/i;
const normName = s => plain(s).toLowerCase().replace(/^\d+[a-z]?\.\s*/, "").replace(/\s*\[[a-z]\]/g, "")
  .replace(/\s*\(.*?\)/g, "").replace(/\s+system$/, "").trim();
const linesOf = n => [...(n.text || "").split("\n").map(l => [l, false]), ...(n.gm || []).map(l => [l, true])];

function nodeHtml(n) {
  if (n.fog) return "UNCHARTED";
  const body = (n.text || n.file || "").split("\n").filter(l => !META.test(l.trim())).join("\n");
  const gm = (n.gm || []).filter(l => !META.test(l.trim()));
  return (n.gmOnly ? '<span class="gmtag">GM ONLY</span>' : "") + (n.fogged ? '<span class="gmtag">HIDDEN BY FOG</span>' : "") +
    md(body) + (gm.length ? `<div class="gm">${gm.map(md).join("<br>")}</div>` : "");
}
function portsOf(n) {
  const out = [];
  (n.text || "").split("\n").forEach(line => {
    for (const m of line.matchAll(/\[([XCBAS])\]/g)) {
      let name = plain(line.slice(0, m.index)).replace(/^\d+[a-z]?\.\s*/, "").trim();
      if (!name || /^(hub )?station$/i.test(name)) name = shortTitle(n);
      out.push({ cls:m[1], name });
    }
  });
  return out;
}
function factionsOf(n) {
  const out = [];
  linesOf(n).forEach(([l, gm]) => {
    const m = l.trim().match(/^faction:\s*(.*)$/i);
    if (m) m[1].split(",").map(s => s.trim()).filter(Boolean).forEach(name => out.push({ name, gm }));
  });
  return out;
}

// ---------- edges & travel
const TRAVEL_REL = /orbit|moon|in-system/i;
const isJump = e => e.color === "6" || !e.label || /^J\d/i.test(e.label);
function edgeInfo(e) {
  if (isJump(e)) { const m = (e.label || "").match(/^J(\d)/i); return { jump:m ? +m[1] : 1, travel:true }; }
  return { jump:0, travel:TRAVEL_REL.test(e.label || ""), insystem:/in-system/i.test(e.label || "") };
}

const world = $("world");
world.style.width = W + "px"; world.style.height = H + "px";
let groups = [], nodes = [], edges = [], byId = {}, adj = {}, index = [], related = [], factionColor = {};
let gmData = null, moved = 0, routeStart = null, routeTo = null, reachOn = false, factionsOn = false, factionPick = null;
let drive = CAMP.drive || 1;

const groupOf = n => {
  const cx = n.x + n.width / 2, cy = n.y + n.height / 2;
  return groups.filter(g => cx > g.x && cx < g.x + g.width && cy > g.y && cy < g.y + g.height)
    .sort((a, b) => a.width * a.height - b.width * b.height)[0];
};
const regionOf = n => groupOf(n)?.label || "";
const center = id => { const n = byId[id]; return [n.x + OX + n.width / 2, n.y + OY + n.height / 2]; };

function resolve(name) {
  const k = normName(name);
  if (!k) return null;
  const live = nodes.filter(n => !n.fog);
  const hit = live.find(n => normName(titleOf(n)) === k) ||
    live.find(n => { const t = normName(titleOf(n)); return t.length >= 4 && (t.startsWith(k) || k.startsWith(t)); });
  return hit ? hit.id : null;
}
function collectRelated() {
  related = [];
  nodes.forEach(n => linesOf(n).filter(([l]) => /^related:/i.test(l.trim())).forEach(([l, gm]) => {
    plain(l.trim().slice(8)).split(/,|·/).map(s => s.trim()).filter(Boolean).forEach(item => {
      const [name, ...note] = item.split(/\s+[—–]\s+/);
      related.push({ from:n.id, to:resolve(name), name:plain(name), note:note.join(" — "), gm });
    });
  }));
}
function relatedOf(n) {
  const out = (adj[n.id] || []).filter(l => !isJump(l.e))
    .map(l => ({ id:l.other, name:titleOf(byId[l.other]), note:l.e.label }));
  related.forEach(r => {
    if (r.from === n.id) out.push({ id:r.to, name:r.to ? titleOf(byId[r.to]) : r.name, note:r.note, gm:r.gm });
    else if (r.to === n.id) out.push({ id:r.from, name:titleOf(byId[r.from]), note:r.note, gm:r.gm });
  });
  return out;
}
function siblingsOf(n) {
  const g = groupOf(n);
  if (!g) return null;
  const sib = nodes.filter(m => m !== n && !m.fog && groupOf(m) === g && !titleOf(m).includes(":"));
  return sib.length && sib.length <= 12 ? { label:g.label, ids:sib.map(m => m.id) } : null;
}
function clip(n, tx, ty) {
  const cx = n.x + n.width / 2, cy = n.y + n.height / 2, dx = tx - cx, dy = ty - cy;
  const t = Math.min(dx ? n.width / 2 / Math.abs(dx) : Infinity, dy ? n.height / 2 / Math.abs(dy) : Infinity, 1);
  return [cx + dx * t + OX, cy + dy * t + OY];
}

// ---------- routing
function dijkstra(start, rating, target) {
  const dist = { [start]:0 }, prev = {}, done = new Set(), q = [[0, start]];
  while (q.length) {
    q.sort((a, b) => a[0] - b[0]);
    const [d, u] = q.shift();
    if (done.has(u)) continue;
    done.add(u);
    if (u === target) break;
    for (const l of adj[u] || []) {
      const info = edgeInfo(l.e);
      if (!info.travel || info.jump > rating || byId[l.other].fog) continue;
      const nd = d + (info.jump ? 1 : 0.001);
      if (nd < (dist[l.other] ?? Infinity)) { dist[l.other] = nd; prev[l.other] = { from:u, e:l.e }; q.push([nd, l.other]); }
    }
  }
  return { dist, prev };
}
function plan(from, to, rating) {
  const { dist, prev } = dijkstra(from, rating, to);
  if (!(to in dist)) return null;
  const hops = [];
  for (let v = to; v !== from; v = prev[v].from) hops.unshift({ from:prev[v].from, to:v, e:prev[v].e });
  return hops;
}
function summarize(hops) {
  const jumps = hops.filter(h => edgeInfo(h.e).jump).length;
  const inSys = hops.filter(h => edgeInfo(h.e).insystem).length;
  const thrust = (jumps ? 2 * (jumps + 1) : 0) + 2 * inSys;
  return { jumps, inSys, thrust, fuel:Math.max(thrust ? 1 : 0, Math.ceil(thrust / 4.3)) };
}
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
const d10 = () => 1 + Math.floor(Math.random() * 10);

const routeBox = $("routebox");
function showRoute(rolled) {
  if (!routeTo) { routeBox.classList.remove("open"); highlightRoute(null); return; }
  const from = routeStart || CAMP.crew;
  if (!from || !byId[from]) { routeBox.innerHTML = "<h4>Route</h4>Set a start point first."; routeBox.classList.add("open"); return; }
  const hops = from === routeTo ? [] : plan(from, routeTo, drive);
  let html = `<h4>Route · Jump-${drive} drive</h4><div><b>${esc(shortTitle(byId[from]))}</b> → <b>${esc(shortTitle(byId[routeTo]))}</b></div>`;
  if (!hops) {
    const need = [2, 3, 4, 5, 6, 7, 8, 9].find(r => r > drive && plan(from, routeTo, r));
    html += `<div class="sum">No route with a Jump-${drive} drive.${need ? ` Needs at least <b>Jump-${need}</b>.` : " No known route at all."}</div>`;
    highlightRoute(null);
  } else {
    const s = summarize(hops);
    html += `<div class="sum">${plural(s.jumps, "jump")} · ${plural(s.jumps, "warp core")}${s.jumps ? ` (${s.jumps}mcr)` : ""}<br>` +
      (s.thrust ? `~${s.thrust} weeks under thrust (~${plural(s.fuel, "fuel")})` : "Hours to days under thrust") +
      (s.jumps ? `<br>+ ${s.jumps}×2d10 days in hyperspace (avg ${s.jumps * 11} days)` : "") + "</div>";
    html += hops.map((h, i) => `<div class="hop">${i + 1}. <b>${esc(shortTitle(byId[h.to]))}</b> · ${esc(h.e.label || "J1")}</div>`).join("");
    if (rolled) html += rolled;
    html += `<div class="acts">${s.jumps ? '<button id="rollbtn">🎲 Roll &amp; fly</button>' : '<button id="flybtn">Fly</button>'}<button id="clearroute">Clear</button></div>`;
    highlightRoute(hops);
    routeBox.innerHTML = html;
    routeBox.classList.add("open");
    $("clearroute").onclick = () => { routeTo = null; showRoute(); };
    const fly = () => animateRoute(hops);
    if ($("flybtn")) $("flybtn").onclick = fly;
    if ($("rollbtn")) $("rollbtn").onclick = () => {
      const rolls = hops.filter(h => edgeInfo(h.e).jump).map(() => [d10(), d10()]);
      const days = rolls.reduce((a, [x, y]) => a + x + y, 0);
      const total = s.thrust * 7 + days;
      showRoute(`<div class="roll">${rolls.map(([x, y], i) => `Jump ${i + 1}: ${x}+${y} = <b>${x + y} days</b>`).join("<br>")}` +
        `<br>Total ≈ <b>${total} days</b> (~${Math.round(total / 7)} weeks)</div>`);
      fly();
    };
    return;
  }
  html += `<div class="acts"><button id="clearroute">Clear</button></div>`;
  routeBox.innerHTML = html;
  routeBox.classList.add("open");
  $("clearroute").onclick = () => { routeTo = null; showRoute(); };
}
function highlightRoute(hops) {
  const on = new Set((hops || []).map(h => h.e.id));
  edges.forEach(e => e.el[0].classList.toggle("route", on.has(e.id)));
}

// ---------- rendering
function render(data) {
  closePanel();
  world.innerHTML = "";
  groups = data.nodes.filter(n => n.type === "group");
  nodes = data.nodes.filter(n => n.type !== "group");
  byId = Object.fromEntries(nodes.map(n => [n.id, n]));
  edges = data.edges.filter(e => byId[e.fromNode] && byId[e.toNode]);
  adj = {};

  [...groups].sort((a, b) => b.width * b.height - a.width * a.height).forEach(g => {
    const el = document.createElement("div");
    el.className = "group" + (g.gmOnly ? " gm-only" : "");
    el.style.cssText = `left:${g.x + OX}px;top:${g.y + OY}px;width:${g.width}px;height:${g.height}px;--gc:${col(g.color, "#3a4552")}`;
    if (g.label) el.innerHTML = `<div class="group-label">${esc(g.label)}</div>`;
    world.appendChild(el);
  });

  const svg = document.createElementNS(SVGNS, "svg");
  svg.id = "edges"; svg.setAttribute("width", W); svg.setAttribute("height", H);
  world.appendChild(svg);

  edges.forEach(e => {
    const a = byId[e.fromNode], b = byId[e.toNode];
    const [x1, y1] = clip(a, b.x + b.width / 2, b.y + b.height / 2), [x2, y2] = clip(b, a.x + a.width / 2, a.y + a.height / 2);
    const kind = e.color === "6" ? "suggested" : !isJump(e) ? "rel" : /^J[2-9]/.test(e.label || "") ? "long" : "";
    const line = document.createElementNS(SVGNS, "line");
    Object.entries({ x1, y1, x2, y2 }).forEach(([k, v]) => line.setAttribute(k, v));
    if (kind) line.classList.add(kind);
    if (a.fog || b.fog) line.classList.add("fogline");
    if (e.color && e.color !== "6") line.style.stroke = col(e.color);
    svg.appendChild(line);
    e.el = [line];
    if (e.label) {
      const l = document.createElement("div");
      l.className = "elabel " + kind;
      l.style.left = (x1 + x2) / 2 + "px"; l.style.top = (y1 + y2) / 2 + "px";
      l.textContent = e.label;
      world.appendChild(l);
      e.el.push(l);
    }
    (adj[a.id] ||= []).push({ e, other:b.id });
    (adj[b.id] ||= []).push({ e, other:a.id });
  });

  const names = [...new Set(nodes.flatMap(n => factionsOf(n).map(f => f.name)))].sort();
  factionColor = Object.fromEntries(names.map((f, i) => [f, FACTION_COLORS[i % FACTION_COLORS.length]]));

  nodes.forEach(n => {
    const el = document.createElement("div");
    el.className = "node" + (n.gmOnly ? " gm-only" : "") + (n.fog ? " fog" : "") + (n.fogged ? " fogged" : "");
    el.style.cssText = `left:${n.x + OX}px;top:${n.y + OY}px;width:${n.width}px;min-height:${n.height}px;--nc:${col(n.color, "#56636f")}`;
    const classes = n.fog ? [] : [...new Set(portsOf(n).map(p => p.cls))];
    el.innerHTML = nodeHtml(n) + (classes.length ? `<div class="badges">${classes.map(badge).join("")}</div>` : "") + '<div class="jumps"></div>';
    if (classes.length) el.style.paddingRight = 14 + classes.length * 32 + "px";
    const fs = n.fog ? [] : factionsOf(n);
    if (fs.length) { el.classList.add("has-faction"); el.style.setProperty("--fc", factionColor[fs[0].name]); }
    el.addEventListener("click", ev => { if (ev.target.closest("a")) return; ev.stopPropagation(); if (moved < 6) select(n.id); });
    world.appendChild(el);
    n.el = el;
  });

  drawCampaign(svg);
  const ship = document.createElement("div");
  ship.id = "ship";
  ship.innerHTML = '<svg viewBox="-50 -50 100 100"><path d="M44 0 L-30 -26 L-16 0 L-30 26 Z" fill="#f5c542" stroke="#fff3c4" stroke-width="3"/><path d="M-18 -8 L-46 0 L-18 8 Z" fill="#7fd3ff" opacity=".85"/></svg>';
  world.appendChild(ship);

  collectRelated();
  index = nodes.filter(n => !n.fog).map(n => ({ id:n.id, title:titleOf(n), region:regionOf(n),
    hay:(plain(n.text || "") + " " + (n.gm || []).join(" ")).toLowerCase() }));
  buildFactionBox(); buildLogBox(); applyOverlays(); showRoute();
}

function drawCampaign(svg) {
  const visits = CAMP.log.filter(l => l.id && byId[l.id]);
  const pts = visits.map(l => center(l.id));
  if (CAMP.crew && byId[CAMP.crew] && visits.at(-1)?.id !== CAMP.crew) pts.push(center(CAMP.crew));
  if (pts.length > 1) {
    const pl = document.createElementNS(SVGNS, "polyline");
    pl.setAttribute("class", "trail");
    pl.setAttribute("points", pts.map(p => p.join(",")).join(" "));
    svg.appendChild(pl);
  }
  visits.forEach((l, i) => {
    const v = document.createElement("div");
    v.className = "visit"; v.textContent = i + 1; v.title = l.note || "";
    byId[l.id].el.appendChild(v);
  });
  const crew = CAMP.crew && byId[CAMP.crew];
  if (crew) {
    crew.el.classList.add("crew");
    const t = document.createElement("div");
    t.className = "crewtag"; t.textContent = `▲ ${CAMP.ship || "Crew"} · here`;
    crew.el.appendChild(t);
  }
}

const badge = c => `<span class="badge" style="--bc:${PORT[c].c}">${c}</span>`;

function applyOverlays() {
  document.body.classList.toggle("reach-on", reachOn);
  document.body.classList.toggle("factions-on", factionsOn);
  $("reachbtn").classList.toggle("on", reachOn);
  $("facbtn").classList.toggle("on", factionsOn);
  const start = routeStart || CAMP.crew;
  const dist = reachOn && start && byId[start] ? dijkstra(start, drive).dist : null;
  nodes.forEach(n => {
    const jumps = dist && n.id in dist ? Math.floor(dist[n.id] + 1e-6) : null;
    n.el.classList.toggle("unreach", !!dist && jumps === null);
    n.el.querySelector(".jumps").textContent = jumps === null ? "" : jumps === 0 ? "here" : `${jumps}J`;
    const fs = factionsOf(n).map(f => f.name);
    n.el.classList.toggle("faction-off", factionsOn && !!factionPick && !fs.includes(factionPick));
  });
  edges.forEach(e => {
    const over = reachOn && edgeInfo(e).jump > drive;
    e.el.forEach(x => x.classList.toggle("over", over));
  });
}

function buildFactionBox() {
  const box = $("facbox"), names = Object.keys(factionColor);
  box.innerHTML = "<h4>Factions</h4>" + (names.length ? names.map(f =>
    `<div class="row${f === factionPick ? " faction-sel" : ""}" data-f="${esc(f)}"><span class="swatch" style="--fc:${factionColor[f]}"></span>${esc(f)}` +
    `<small>${nodes.filter(n => factionsOf(n).some(x => x.name === f)).map(shortTitle).join(", ")}</small></div>`).join("") : "No factions tagged yet.");
  box.querySelectorAll("[data-f]").forEach(r => r.onclick = () => {
    factionPick = factionPick === r.dataset.f ? null : r.dataset.f;
    buildFactionBox(); applyOverlays();
  });
  box.classList.toggle("open", factionsOn);
}
function buildLogBox() {
  const box = $("logbox");
  const rows = CAMP.log.map((l, i) => `<div class="row" ${l.id && byId[l.id] ? `data-id="${l.id}"` : ""}>${i + 1}. ${esc(l.name)}<small>${esc(l.note || "")}</small></div>`);
  const crew = CAMP.crew && byId[CAMP.crew];
  box.innerHTML = `<h4>Travel log${CAMP.ship ? " · " + esc(CAMP.ship) : ""}</h4>` + (rows.join("") || "Nothing logged yet.") +
    (crew ? `<div class="row" data-id="${CAMP.crew}">▲ Now: ${esc(shortTitle(crew))}</div>` : "");
  box.querySelectorAll("[data-id]").forEach(r => r.onclick = () => { select(r.dataset.id); flyTo(r.dataset.id); });
}

function merged(pub, gm) {
  const real = id => (gm.alias || {})[id] ?? id;
  const nodes = pub.nodes.map(n => {
    const base = n.fog ? { ...gm.fog[n.id], fogged:true } : n;
    return { ...base, label:gm.labels[n.id] ?? base.label, gm:gm.notes[base.id] };
  }).concat(gm.nodes.map(n => ({ ...n, gmOnly:true })));
  const edges = pub.edges.map(e => ({ ...e, fromNode:real(e.fromNode), toNode:real(e.toNode), label:gm.labels[e.id] ?? e.label }))
    .concat(gm.edges);
  return { nodes, edges };
}

// ---------- GM unlock
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const concat = (a, b) => { const r = new Uint8Array(a.length + b.length); r.set(a); r.set(b, a.length); return r; };
async function unlock(pw) {
  const S = crypto.subtle, salt = unb64(LOCK.salt), iv = unb64(LOCK.iv), ct = unb64(LOCK.ct), tag = unb64(LOCK.tag);
  const base = await S.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  const bits = new Uint8Array(await S.deriveBits({ name:"PBKDF2", salt, iterations:LOCK.iter, hash:"SHA-256" }, base, 512));
  const hk = raw => S.importKey("raw", raw, { name:"HMAC", hash:"SHA-256" }, false, ["sign"]);
  const ek = await hk(bits.slice(0, 32)), mk = await hk(bits.slice(32));
  const mac = new Uint8Array(await S.sign("HMAC", mk, concat(iv, ct)));
  if (mac.length !== tag.length || mac.some((b, i) => b !== tag[i])) return null;
  const blocks = await Promise.all(Array.from({ length: Math.ceil(ct.length / 32) }, (_, i) => {
    const ctr = new Uint8Array(8); new DataView(ctr.buffer).setBigUint64(0, BigInt(i));
    return S.sign("HMAC", ek, concat(iv, ctr));
  }));
  const out = new Uint8Array(ct.length);
  blocks.forEach((blk, i) => { const u = new Uint8Array(blk); for (let j = 0; j < 32 && i * 32 + j < ct.length; j++) out[i * 32 + j] = ct[i * 32 + j] ^ u[j]; });
  return JSON.parse(new TextDecoder().decode(out));
}

const gmForm = $("gmform"), gmInput = $("gmpw"), gmMsg = $("gmmsg"), gmBtn = $("gmbtn");
function setGm(data) {
  gmData = data;
  vault = data ? data.vault : null;
  document.body.classList.toggle("gm-mode", !!data);
  gmBtn.textContent = data ? "🔓 GM" : "🔒";
  if (routeTo && !data && PUBLIC.nodes.find(n => n.id === routeTo && n.fog)) routeTo = null;
  render(data ? merged(PUBLIC, data) : PUBLIC);
  openFromHash();
}
gmBtn.onclick = () => {
  if (gmData) { sessionStorage.removeItem("starmap-gm"); return setGm(null); }
  gmForm.classList.toggle("open"); gmMsg.textContent = "";
  if (gmForm.classList.contains("open")) gmInput.focus();
};
gmForm.onsubmit = async e => {
  e.preventDefault();
  if (!window.crypto || !crypto.subtle) { gmMsg.textContent = "GM mode needs the page served over https (or opened as a local file)."; return; }
  gmMsg.textContent = "Checking…";
  const data = await unlock(gmInput.value).catch(() => null);
  if (!data) { gmMsg.textContent = "Wrong password."; gmInput.select(); return; }
  sessionStorage.setItem("starmap-gm", gmInput.value);
  gmInput.value = ""; gmMsg.textContent = ""; gmForm.classList.remove("open");
  setGm(data);
};

// ---------- pan & zoom
const vp = $("viewport");
let scale = 1, tx = 0, ty = 0;
const apply = () => { world.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`; drawStars(); };
function zoomAt(px, py, k) {
  const ns = Math.min(3, Math.max(0.03, scale * k)); k = ns / scale;
  tx = px - (px - tx) * k; ty = py - (py - ty) * k; scale = ns; apply();
}
function fit() {
  scale = Math.min(innerWidth / W, innerHeight / H) * 0.96;
  tx = (innerWidth - W * scale) / 2; ty = (innerHeight - H * scale) / 2; apply();
}
function animateTo(ns, ntx, nty) {
  const s0 = scale, x0 = tx, y0 = ty, t0 = performance.now();
  const step = t => {
    const p = Math.min(1, (t - t0) / 450), q = 1 - Math.pow(1 - p, 3);
    scale = s0 + (ns - s0) * q; tx = x0 + (ntx - x0) * q; ty = y0 + (nty - y0) * q; apply();
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
function flyTo(id) {
  const ns = Math.max(scale, 0.55), panelW = innerWidth > 800 ? 380 : 0, [cx, cy] = center(id);
  animateTo(ns, (innerWidth - panelW) / 2 - cx * ns, innerHeight / 2 - cy * ns);
}

vp.addEventListener("wheel", e => { e.preventDefault(); zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0015))); }, { passive:false });
const pts = new Map();
vp.addEventListener("pointerdown", e => { pts.set(e.pointerId, { x:e.clientX, y:e.clientY }); moved = 0; });
addEventListener("pointermove", e => {
  const p = pts.get(e.pointerId); if (!p) return;
  if (pts.size === 1) {
    tx += e.clientX - p.x; ty += e.clientY - p.y;
    moved += Math.abs(e.clientX - p.x) + Math.abs(e.clientY - p.y);
    p.x = e.clientX; p.y = e.clientY; apply();
    if (moved > 6) vp.classList.add("dragging");
  } else if (pts.size === 2) {
    const [a, b] = [...pts.values()], before = Math.hypot(a.x - b.x, a.y - b.y);
    p.x = e.clientX; p.y = e.clientY;
    const after = Math.hypot(a.x - b.x, a.y - b.y);
    if (before > 0) zoomAt((a.x + b.x) / 2, (a.y + b.y) / 2, after / before);
    moved = 99;
  }
});
const up = e => { pts.delete(e.pointerId); if (!pts.size) vp.classList.remove("dragging"); };
addEventListener("pointerup", up); addEventListener("pointercancel", up);
vp.addEventListener("click", () => { if (moved < 6) deselect(); });

$("fit").onclick = fit;
$("zin").onclick = () => zoomAt(innerWidth / 2, innerHeight / 2, 1.4);
$("zout").onclick = () => zoomAt(innerWidth / 2, innerHeight / 2, 1 / 1.4);
$("crewbtn").onclick = () => { if (CAMP.crew && byId[CAMP.crew]) { select(CAMP.crew); flyTo(CAMP.crew); } };
$("reachbtn").onclick = () => { reachOn = !reachOn; applyOverlays(); };
$("facbtn").onclick = () => { factionsOn = !factionsOn; if (!factionsOn) factionPick = null; buildFactionBox(); applyOverlays(); };
$("logbtn").onclick = () => { $("logbox").classList.toggle("open"); $("logbtn").classList.toggle("on", $("logbox").classList.contains("open")); };
const driveSel = $("drive");
driveSel.innerHTML = [1, 2, 3, 4, 5, 9].map(r => `<option value="${r}">Jump-${r}${r === CAMP.drive ? " (ship)" : ""}</option>`).join("");
driveSel.value = drive;
driveSel.onchange = () => { drive = +driveSel.value; applyOverlays(); showRoute(); };
addEventListener("resize", drawStars);

// ---------- selection & panel
const panel = $("panel"), pcontent = $("pcontent");
function select(id) {
  const n = byId[id];
  if (!n) return;
  const links = adj[id] || [], rel = n.fog ? [] : relatedOf(n), sib = n.fog ? null : siblingsOf(n);
  const keep = new Set([id, ...links.map(l => l.other), ...rel.filter(r => r.id).map(r => r.id)]);
  nodes.forEach(m => { m.el.classList.toggle("dim", !keep.has(m.id)); m.el.classList.toggle("sel", m.id === id); });
  edges.forEach(e => {
    const on = e.fromNode === id || e.toNode === id;
    e.el.forEach(x => x.classList.toggle("dim", !on));
    e.el[0].classList.toggle("hl", on);
  });
  if (n.fog) {
    pcontent.innerHTML = `<div class="region">${esc(regionOf(n))}</div><div class="body"><h1>Uncharted</h1>No navigation data. Get closer, or find someone who's been there.</div>`;
    panel.classList.add("open");
    setHash(null);
    return;
  }
  const item = (oid, name, note, gm) => `<div class="conn${gm ? " gmrel" : ""}"${oid ? ` data-id="${oid}"` : ""}>` +
    `${esc(name)}${note ? ` <span>${esc(note)}</span>` : ""}</div>`;
  const ports = portsOf(n).map(p => `<div class="conn port">${badge(p.cls)}${esc(p.name)}<small>${esc(PORT[p.cls].d)}</small>` +
    `<small>Shore leave: ${esc(PORT[p.cls].leave)}</small><small>Ship upgrades: ${PORT[p.cls].up ? "can be installed here" : "not available"}` +
    `${"XC".includes(p.cls) ? " · limited stock" : ""}</small></div>`).join("");
  const facs = factionsOf(n).map(f => `<span class="chip${f.gm ? " gmrel" : ""}" style="border-color:${factionColor[f.name]}">${esc(f.name)}</span>`).join("");
  const routes = links.filter(l => isJump(l.e) || edgeInfo(l.e).travel).map(l => item(l.other, titleOf(byId[l.other]), l.e.label || "J1")).join("");
  const rels = rel.filter(r => !(r.id && links.some(l => l.other === r.id && edgeInfo(l.e).travel && !isJump(l.e)))).map(r => item(r.id, r.name, r.note, r.gm)).join("");
  const chips = sib ? sib.ids.map(s => `<span class="chip" data-id="${s}">${esc(titleOf(byId[s]))}</span>`).join("") : "";
  const from = routeStart || CAMP.crew;
  pcontent.innerHTML = `<div class="region">${esc(regionOf(n))}</div><div class="body">${nodeHtml(n)}</div>` +
    `<div class="acts">${from && from !== id ? `<button data-act="route">🧭 Route here</button>` : ""}` +
    `<button data-act="start">${routeStart === id ? "✓ Route start" : "Start route here"}</button><button data-act="link">🔗 Copy link</button></div>` +
    (ports ? `<h3>Port class</h3>${ports}` : "") +
    (facs ? `<h3>Factions</h3><div class="chips">${facs}</div>` : "") +
    (routes ? `<h3>Routes</h3>${routes}` : "") +
    (rels ? `<h3>Related</h3>${rels}` : "") +
    (chips ? `<h3>Also in ${esc(sib.label)}</h3><div class="chips">${chips}</div>` : "");
  pcontent.querySelectorAll("[data-id]").forEach(c => c.onclick = () => { select(c.dataset.id); flyTo(c.dataset.id); });
  pcontent.querySelectorAll("[data-act]").forEach(b => b.onclick = () => {
    if (b.dataset.act === "route") { routeTo = id; showRoute(); }
    if (b.dataset.act === "start") { routeStart = routeStart === id ? null : id; applyOverlays(); showRoute(); select(id); }
    if (b.dataset.act === "link") {
      const url = location.href.split("#")[0] + "#" + encodeURIComponent(id);
      (navigator.clipboard?.writeText(url) || Promise.reject()).then(() => { b.textContent = "✓ Copied"; }, () => prompt("Copy this link:", url));
    }
  });
  panel.classList.add("open");
  setHash(id);
}
function closePanel() { panel.classList.remove("open"); }
function deselect() {
  nodes.forEach(m => m.el.classList.remove("dim", "sel"));
  edges.forEach(e => { e.el.forEach(x => x.classList.remove("dim")); e.el[0].classList.remove("hl"); });
  closePanel();
  setHash(null);
}
$("close").onclick = deselect;
addEventListener("keydown", e => { if (e.key === "Escape" && document.activeElement.tagName !== "INPUT") deselect(); });

function setHash(id) {
  history.replaceState(null, "", id ? "#" + encodeURIComponent(id) : location.pathname + location.search);
}
function openFromHash() {
  const id = decodeURIComponent(location.hash.slice(1));
  if (id && byId[id] && !byId[id].fog) { select(id); flyTo(id); }
}
addEventListener("hashchange", openFromHash);

// ---------- ship animation
function animateRoute(hops) {
  const ship = $("ship"), pts = [center(hops[0].from), ...hops.map(h => center(h.to))];
  ship.style.display = "block";
  let i = 0;
  const leg = () => {
    if (i >= hops.length) { setTimeout(() => { ship.style.display = "none"; }, 1500); return; }
    const a = pts[i], b = pts[i + 1], jump = edgeInfo(hops[i].e).jump, t0 = performance.now(), dur = jump ? 1300 : 600;
    const ang = Math.atan2(b[1] - a[1], b[0] - a[0]) * 180 / Math.PI;
    if (jump) warp();
    const step = t => {
      const p = Math.min(1, (t - t0) / dur), q = p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
      ship.style.transform = `translate(${a[0] + (b[0] - a[0]) * q}px, ${a[1] + (b[1] - a[1]) * q}px) rotate(${ang}deg)`;
      if (p < 1) requestAnimationFrame(step); else { i++; setTimeout(leg, 250); }
    };
    requestAnimationFrame(step);
  };
  leg();
}

// ---------- starfield (parallax + hyperspace streaks)
const WARP_MS = 900;
let warpUntil = 0, starQueued = false;
const starLayers = (() => {
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  return [0.02, 0.05, 0.1].map((f, li) => ({ f, stars:Array.from({ length:260 }, () => [rnd(), rnd(), 0.3 + rnd() * (0.5 + li * 0.45), 0.2 + rnd() * 0.7]) }));
})();
function warp() {
  warpUntil = performance.now() + WARP_MS;
  const f = $("flash"); f.classList.remove("go"); void f.offsetWidth; f.classList.add("go");
  drawStars();
}
function drawStars() { if (!starQueued) { starQueued = true; requestAnimationFrame(paintStars); } }
function paintStars() {
  starQueued = false;
  const c = $("stars"), ctx = c.getContext("2d"), dpr = devicePixelRatio || 1, w = innerWidth, h = innerHeight;
  if (c.width !== w * dpr || c.height !== h * dpr) { c.width = w * dpr; c.height = h * dpr; c.style.width = w + "px"; c.style.height = h + "px"; }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  const wp = warpUntil ? Math.max(0, (warpUntil - performance.now()) / WARP_MS) : 0;
  ctx.fillStyle = ctx.strokeStyle = "#fff";
  for (const { f, stars } of starLayers) for (const [sx, sy, r, a] of stars) {
    const x = ((sx * w + tx * f) % w + w) % w, y = ((sy * h + ty * f) % h + h) % h;
    ctx.globalAlpha = a;
    if (wp > 0) {
      const k = Math.sin(wp * Math.PI) * 0.35 * (1 + f * 8);
      ctx.lineWidth = r * 1.5; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + (x - w / 2) * k, y + (y - h / 2) * k); ctx.stroke();
    } else { ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); }
  }
  if (wp > 0) drawStars(); else warpUntil = 0;
}

// ---------- search
const search = $("search"), results = $("results");
let hits = [], active = 0;
function renderHits() {
  results.style.display = hits.length ? "block" : "none";
  results.innerHTML = hits.map((h, i) => `<div data-id="${h.id}" class="${i === active ? "active" : ""}">${esc(h.title)}<br><small>${esc(h.region)}</small></div>`).join("");
  results.querySelectorAll("div").forEach(d => d.onclick = () => pick(d.dataset.id));
}
function pick(id) { select(id); flyTo(id); hits = []; renderHits(); search.blur(); }
search.addEventListener("input", () => {
  const q = search.value.trim().toLowerCase(); active = 0;
  hits = q ? index.filter(h => h.hay.includes(q))
    .sort((a, b) => b.title.toLowerCase().startsWith(q) - a.title.toLowerCase().startsWith(q)).slice(0, 8) : [];
  renderHits();
});
search.addEventListener("keydown", e => {
  if (e.key === "ArrowDown") { active = Math.min(active + 1, hits.length - 1); renderHits(); e.preventDefault(); }
  if (e.key === "ArrowUp") { active = Math.max(active - 1, 0); renderHits(); e.preventDefault(); }
  if (e.key === "Enter" && hits[active]) pick(hits[active].id);
  if (e.key === "Escape") { hits = []; renderHits(); search.blur(); }
});

render(PUBLIC); fit(); openFromHash();
const remembered = sessionStorage.getItem("starmap-gm");
if (remembered && window.crypto && crypto.subtle) unlock(remembered).then(d => d && setGm(d)).catch(() => {});
</script>
